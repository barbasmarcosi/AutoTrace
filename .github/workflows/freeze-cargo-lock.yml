# Temporary, tightly scoped release-candidate migration:
# commit the exact Cargo resolver output on the trusted integration branch.
# Once Cargo.lock is checked in, this workflow is removed and all builds use --locked.
name: Freeze Cargo.lock (integration branch only)

on:
  pull_request:
    paths:
      - '.github/workflows/freeze-cargo-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-lock:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integrate/desktop-quality-rc-20261024' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted AutoTrace integration head
        uses: actions/checkout@v4
        with:
          ref: integrate/desktop-quality-rc-20261024
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependency versions for all supported targets
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit exact Cargo.lock only if absent
        shell: bash
        run: |
          set -euo pipefail
          test -f desktop/src-tauri/Cargo.lock
          git add desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already committed; no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(rust): freeze Cargo dependency versions for reproducible Desktop builds"
          git push origin HEAD:refs/heads/integrate/desktop-quality-rc-20261024
