name: Desktop foundation (PR)

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/**'
      - 'site/**'
      - '.github/workflows/desktop-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

# Avoid compiling many previous versions of the same pull request on paid Windows runners.
concurrency:
  group: autotrace-desktop-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current browser model and desktop bridge
        run: |
          node --check site/app.js
          node --test tests/*.test.mjs
      - name: Audit Desktop release policy and security regressions
        run: |
          python3 scripts/check_desktop_release_policy.py
          python3 -m unittest discover -s tests -p 'test_release_policy.py' -v
      - name: Verify SQLite D1 migration constraints and rollback
        run: python3 -m unittest discover -s tests -p 'test_desktop_schema.py' -v
  windows-compile:
    runs-on: windows-latest
    env:
      # Public OAuth Desktop client ID. Empty until AutoTrace's Google Cloud app is registered.
      AUTOTRACE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.AUTOTRACE_GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Rust unit tests, SQLite and Excel roundtrip on Windows
        working-directory: desktop/src-tauri
        run: cargo test --locked --all-targets
      - name: Verify tracked dependency lockfile remains unchanged
        shell: pwsh
        run: |
          if (git status --porcelain -- desktop/src-tauri/Cargo.lock) {
            throw "Cargo.lock changed unexpectedly during locked build"
          }
