name: Desktop foundation (PR)

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/**'
      - 'site/**'
      - '.github/workflows/desktop-foundation.yml'
      - '.github/workflows/desktop-installer.yml'
      - 'scripts/verify-acceptance-installer.ps1'
      - 'docs/desktop/ACCEPTANCE_PACKAGE_U0_U7.md'
  workflow_dispatch:

permissions:
  contents: read

# Avoid compiling many previous versions of the same pull request on paid Windows runners.
concurrency:
  group: autotrace-desktop-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate current browser model and desktop bridge
        run: |
          node --check site/app.js
          node --test tests/*.test.mjs
      - name: Audit Desktop release policy and security regressions
        run: |
          python3 scripts/check_desktop_release_policy.py
          python3 -m unittest discover -s tests -p 'test_release_policy.py' -v
      - name: Verify SQLite D1 migration constraints and rollback
        run: python3 -m unittest discover -s tests -p 'test_desktop_schema.py' -v
  windows-compile:
    runs-on: windows-latest
    env:
      # Public OAuth Desktop client ID. Empty until AutoTrace's Google Cloud app is registered.
      AUTOTRACE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.AUTOTRACE_GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable verified 2026-10-24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Rust unit tests, SQLite and Excel roundtrip on Windows
        working-directory: desktop/src-tauri
        run: cargo test --locked --all-targets
      - name: Profile 1k/10k/50k synthetic orders (non-gating latency evidence)
        working-directory: desktop/src-tauri
        # This asserts full read/write roundtrips. Runner timing is logged, not
        # interpreted as a physical workshop PC performance guarantee.
        run: cargo test --locked release_scale_profile -- --ignored --nocapture
      - name: Classify advisory warnings in Windows dependency tree
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          # RustSec intentionally scans the full lockfile including Linux-only deps.
          # Print Windows-target reachability, without hiding/ignoring advisories.
          $resolved = @(cargo tree --locked --target x86_64-pc-windows-msvc --edges normal,build --prefix none --format '{p}')
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the Windows-target dependency tree" }
          foreach ($package in @('basic-toml','proc-macro-error','proc-macro-error2','zbus_names','zvariant','zvariant_derive','glib')) {
            $pattern = '^' + [regex]::Escape($package) + ' v'
            $found = @($resolved | Where-Object { $_ -match $pattern } | Select-Object -Unique)
            if ($found.Count -eq 0) {
              Write-Host "WINDOWS_TARGET_ABSENT: $package"
            } else {
              Write-Host "WINDOWS_TARGET_PRESENT: $package :: $($found -join ', ')"
            }
          }
      - name: Verify tracked dependency lockfile remains unchanged
        shell: pwsh
        run: |
          if (git status --porcelain -- desktop/src-tauri/Cargo.lock) {
            throw "Cargo.lock changed unexpectedly during locked build"
          }
