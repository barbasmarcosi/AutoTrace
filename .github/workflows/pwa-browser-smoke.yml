name: Browser startup smoke for Excel LAB
on:
  push:
    branches: [plan/desktop-sqlite-excel-backups-20261021]
    paths:
      - '.github/workflows/pwa-browser-smoke.yml'
      - 'site/**'
      - 'scripts/build-pages-preview.py'
      - 'tests/browser-excel.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate modules and regression tests
        run: |
          node --test tests/*.test.mjs
          node --check site/app.js
          node --check site/browser-excel.mjs
          node --check site/browser-backup.mjs
      - name: Serve isolated LAB locally
        run: |
          python3 scripts/build-pages-preview.py site site /tmp/autotrace-smoke
          node --check /tmp/autotrace-smoke/lab/app.js
      - name: Install Playwright driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Browser integration test (real wait + console)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory /tmp/autotrace-smoke >/tmp/lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/pwa-browser-smoke.mjs
