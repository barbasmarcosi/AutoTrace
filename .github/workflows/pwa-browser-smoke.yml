name: Browser startup smoke for Excel LAB
on:
  push:
    branches: [plan/desktop-sqlite-excel-backups-20261021]
    paths:
      - '.github/workflows/pwa-browser-smoke.yml'
      - 'site/**'
      - 'scripts/build-pages-preview.py'
      - 'tests/browser-excel.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate modules and regression tests
        run: |
          node --test tests/*.test.mjs
          node --check site/app.js
          node --check site/browser-excel.mjs
          node --check site/browser-backup.mjs
      - name: Serve isolated LAB locally
        run: |
          python3 scripts/build-pages-preview.py site site /tmp/autotrace-smoke
          node --check /tmp/autotrace-smoke/lab/app.js
      - name: Check rendered dashboard in headless Chromium
        shell: bash
        run: |
          set -u
          python3 -m http.server 8765 --directory /tmp/autotrace-smoke >/tmp/lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          set +e
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --enable-logging=stderr --v=0 --virtual-time-budget=14000 \
            --dump-dom http://127.0.0.1:8765/lab/ > /tmp/lab-dom.html 2>/tmp/lab-chrome.log
          code=$?
          set -e
          echo "Chrome status: $code"
          echo "Browser JS errors:"
          grep -Ei 'CONSOLE|Uncaught|SyntaxError|ReferenceError|TypeError|ERR_|Failed to' /tmp/lab-chrome.log | tail -30 || true
          echo "DOM status:"
          grep -Eo 'AUTOTRACE LAB|PANEL DE CONTROL|Cargando AutoTrace|No se pudo abrir la base[^<]*|Modo demostración|Configuración y respaldos' /tmp/lab-dom.html | head -25 || true
          echo "HTTP requests:"
          tail -25 /tmp/lab-http.log || true
          if [ "$code" -ne 0 ] || ! grep -Eq 'PANEL DE CONTROL|Modo demostración' /tmp/lab-dom.html; then
            echo "::error::Local Excel LAB failed to render"
            exit 1
          fi
          echo 'PASS: local LAB rendered dashboard'
