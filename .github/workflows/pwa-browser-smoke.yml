name: Browser startup smoke for Excel LAB
on:
  pull_request:
    paths:
      - '.github/workflows/pwa-browser-smoke.yml'
      - '.github/workflows/desktop-installer.yml'
      - 'scripts/verify-acceptance-installer.ps1'
      - 'docs/desktop/ACCEPTANCE_PACKAGE_U0_U7.md'
      - 'desktop/**'
      - 'site/**'
      - 'scripts/build-pages-preview.py'
      - 'tests/**'
  push:
    branches: [plan/desktop-sqlite-excel-backups-20261021, 'feature/**', 'fix/**']
    paths:
      - '.github/workflows/pwa-browser-smoke.yml'
      - 'site/**'
      - 'scripts/build-pages-preview.py'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR events default to a synthetic merge ref; release evidence must
          # use the exact reviewed source commit instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate modules and regression tests
        run: |
          node --test tests/*.test.mjs
          node --check site/app.js
          node --check site/browser-excel.mjs
          node --check site/browser-backup.mjs
          node --check site/workshop-pdf.mjs
          for script in tests/*smoke.mjs; do node --check "$script"; done
      - name: Serve isolated LAB locally
        run: |
          python3 -m unittest discover -s tests -p 'test_pages_preview_builder.py'
          python3 scripts/build-pages-preview.py site site /tmp/autotrace-smoke
          node --check /tmp/autotrace-smoke/lab/app.js
      - name: Install Playwright driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 pdfjs-dist@4.10.38
      - name: Parse both PDF variants using independent PDF.js
        run: node tests/workshop-pdf-pdfjs-smoke.mjs
      - name: Browser integration test (real wait + console)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory /tmp/autotrace-smoke >/tmp/lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/pwa-browser-smoke.mjs
          # Exercise Desktop recovery dialogs with a synthetic Tauri bridge,
          # without making OAuth requests or touching real customer files.
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/desktop-browser-smoke.mjs
          # End-to-end Desktop contract: synthetic native persistence across
          # full browser reload, money ledger, and rejected optimistic writes.
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node tests/desktop-workflow-browser-smoke.mjs
