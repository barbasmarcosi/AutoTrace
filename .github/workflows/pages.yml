name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static application
        run: |
          node --check site/app.js
          node --check site/model.mjs
          node --check site/search.mjs
          node --test tests/*.test.mjs
          test -f site/manifest.webmanifest
          python3 -m json.tool site/manifest.webmanifest >/dev/null
          test -f site/sw.js
          test -f site/assets/icon-192.png
          test -f site/assets/icon-512.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
