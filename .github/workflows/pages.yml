name: Deploy stable PWA and independent Excel LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main PWA
        uses: actions/checkout@v4
        with:
          ref: main
          path: _stable
      - name: Checkout finance-enabled Excel LAB (reviewed revision)
        uses: actions/checkout@v4
        with:
          # Pinned to PR #7 for reproducible QA; stable site remains checked out from main.
          ref: 9127319d5c957f3dea471812e61c0283516c1fe3
          path: _lab
      - name: Test both applications
        run: |
          node --check _stable/site/app.js
          node --check _lab/site/app.js
          node --check _lab/site/browser-excel.mjs
          node --check _lab/site/browser-backup.mjs
          node --test _lab/tests/*.test.mjs
      - name: Audit exact Excel LAB source commit
        run: |
          set -euo pipefail
          echo "Stable SHA: $(git -C _stable rev-parse HEAD)"
          echo "LAB SHA:    $(git -C _lab rev-parse HEAD)"
          test "$(git -C _lab rev-parse HEAD)" = "9127319d5c957f3dea471812e61c0283516c1fe3"
      - name: Build isolated lab and stable root
        run: python3 _lab/scripts/build-pages-preview.py _stable/site _lab/site dist
      - name: Publish LAB release marker and invalidate only its service-worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          sw = Path('dist/lab/sw.js')
          original = sw.read_text(encoding='utf-8')
          needle = "const CACHE = 'autotrace-lab-shell-v8';"
          assert original.count(needle) == 1, "Unexpected LAB service worker version"
          sw.write_text(original.replace(needle, "const CACHE = 'autotrace-lab-shell-finance-v9';"), encoding='utf-8')
          manifest = {
              "environment": "lab",
              "source": "AutoTrace PR #7",
              "commit": "9127319d5c957f3dea471812e61c0283516c1fe3",
              "features": ["labor-contribution", "payment-methods", "payment-destinations", "excel-backup-v3"]
          }
          Path('dist/lab/release.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n", encoding='utf-8')
          assert b"autotrace-lab" not in Path('dist/app.js').read_bytes(), "Stable JS modified"
          PY
      - name: Verify LAB startup, customer import, cash-flow entry and vehicle reuse
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/lab/app.js
          npm install --no-save --no-package-lock playwright-core@1.56.1
          python3 -m http.server 8765 --directory dist >/tmp/autotrace-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node _lab/tests/pwa-browser-smoke.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
