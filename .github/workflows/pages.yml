name: Deploy stable PWA and independent Excel LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main PWA
        uses: actions/checkout@v4
        with:
          ref: main
          path: _stable
      - name: Checkout Excel LAB
        uses: actions/checkout@v4
        with:
          ref: plan/desktop-sqlite-excel-backups-20261021
          path: _lab
      - name: Test both applications
        run: |
          node --check _stable/site/app.js
          node --check _lab/site/app.js
          node --check _lab/site/browser-excel.mjs
          node --check _lab/site/browser-backup.mjs
          node --test _lab/tests/*.test.mjs
      - name: Build isolated lab and stable root
        run: python3 _lab/scripts/build-pages-preview.py _stable/site _lab/site dist
      - name: Verify LAB startup and controls in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/lab/app.js
          npm install --no-save --no-package-lock playwright-core@1.56.1
          python3 -m http.server 8765 --directory dist >/tmp/autotrace-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node _lab/tests/pwa-browser-smoke.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
