name: Desktop dependency advisory audit

on:
  pull_request:
    paths:
      - 'desktop/src-tauri/Cargo.lock'
      - 'desktop/src-tauri/Cargo.toml'
      - '.github/workflows/desktop-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: autotrace-rustsec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install reviewed cargo-audit version
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check RustSec advisories for the tracked lockfile
        run: cargo audit --file desktop/src-tauri/Cargo.lock
