name: Desktop dependency advisory audit

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/**'
      - 'site/**'
      - '.github/workflows/desktop-foundation.yml'
      - '.github/workflows/desktop-installer.yml'
      - '.github/workflows/desktop-security.yml'
      - '.github/workflows/pwa-browser-smoke.yml'
      - 'scripts/check_age_passphrase_compatibility.sh'
      - 'scripts/verify-acceptance-installer.ps1'
      - 'docs/desktop/ACCEPTANCE_PACKAGE_U0_U7.md'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: autotrace-rustsec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable verified 2026-10-24
      - name: Install reviewed cargo-audit version
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check RustSec advisories for the tracked lockfile
        run: cargo audit --file desktop/src-tauri/Cargo.lock

  # Separate compatibility proof: the old library is compiled only in a
  # disposable, synthetic CI fixture, never in AutoTrace's release lockfile.
  age-backup-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cross-version age v1 scrypt archive compatibility and tamper rejection
        run: bash scripts/check_age_passphrase_compatibility.sh
