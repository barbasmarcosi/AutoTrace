[package]
name = "autotrace-desktop"
version = "0.1.0"
description = "AutoTrace local-first desktop"
authors = ["AutoTrace contributors"]
edition = "2021"
build = "build.rs"

[lib]
name = "autotrace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
